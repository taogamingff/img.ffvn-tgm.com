<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>FFVN.TGM - CÔNG CỤ CHÈN ẢNH TẠO LINK URL</title>

<meta name="description" content="Công cụ chèn ảnh và tạo link URL trực tiếp nhanh chóng từ FFVN.TGM. Hỗ trợ upload hình ảnh từ điện thoại và máy tính, tự động tạo URL hình ảnh để sử dụng trên website, bài viết và các nền tảng khác.">

<style>
@font-face{
    font-family:"GFF-Latin-Bold";
    src:
        url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2") format("woff2"),
        url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff") format("woff");
    font-display:swap;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --orange:#ff6a00;
    --orange2:#ff9d2e;
    --bg:#070707;
    --card:rgba(20,20,20,.72);
    --border:rgba(255,106,0,.28);
    --text:#fff;
    --muted:#a9a9a9;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    color:var(--text);
    font-family:"GFF-Latin-Bold",Arial,sans-serif;
    background:
        radial-gradient(circle at 15% 15%,rgba(255,106,0,.20),transparent 28%),
        radial-gradient(circle at 85% 20%,rgba(255,155,45,.12),transparent 25%),
        radial-gradient(circle at 50% 100%,rgba(255,106,0,.10),transparent 35%),
        #050505;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(120deg,transparent 0%,rgba(255,255,255,.015) 50%,transparent 100%);
    z-index:-1;
}

.container{
    width:min(920px,94%);
    margin:auto;
}

/* HEADER */

.header{
    padding:20px 0 10px;
}

.logo{
    width:74px;
    height:74px;
    border-radius:22px;
    object-fit:cover;
    display:block;
    margin:auto;
    border:2px solid rgba(255,106,0,.55);
    box-shadow:
        0 0 25px rgba(255,106,0,.25),
        0 0 70px rgba(255,106,0,.08);
}

.title{
    text-align:center;
    font-size:clamp(24px,6vw,42px);
    margin-top:15px;
    letter-spacing:.5px;
    text-shadow:0 0 18px rgba(255,106,0,.22);
}

.subtitle{
    text-align:center;
    color:var(--muted);
    font-family:Arial,sans-serif;
    font-size:14px;
    line-height:1.6;
    max-width:700px;
    margin:10px auto 0;
}

/* MAIN CARD */

.main-card{
    margin:28px auto;
    padding:22px;
    border:1px solid var(--border);
    border-radius:28px;
    background:linear-gradient(
        145deg,
        rgba(255,106,0,.09),
        rgba(255,255,255,.025)
    );
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:
        0 25px 80px rgba(0,0,0,.5),
        inset 0 1px rgba(255,255,255,.05);
}

/* UPLOAD */

.upload-box{
    border:2px dashed rgba(255,106,0,.48);
    border-radius:22px;
    min-height:220px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:25px;
    cursor:pointer;
    background:rgba(255,106,0,.035);
    transition:.25s ease;
}

.upload-box:hover{
    border-color:var(--orange);
    background:rgba(255,106,0,.08);
    transform:translateY(-2px);
}

.upload-icon{
    width:68px;
    height:68px;
    border-radius:20px;
    display:grid;
    place-items:center;
    font-size:31px;
    background:linear-gradient(145deg,var(--orange),#ff3d00);
    box-shadow:0 12px 30px rgba(255,106,0,.25);
    margin-bottom:15px;
}

.upload-title{
    font-size:21px;
}

.upload-desc{
    color:#aaa;
    font-family:Arial,sans-serif;
    font-size:13px;
    margin-top:8px;
    line-height:1.5;
}

#fileInput{
    display:none;
}

/* PREVIEW */

.preview-section{
    display:none;
    margin-top:22px;
}

.preview{
    width:100%;
    max-height:430px;
    object-fit:contain;
    display:block;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.1);
    background:#000;
}

/* INFO */

.info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:14px;
}

.info-item{
    padding:13px;
    border-radius:15px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.06);
    min-width:0;
}

.info-label{
    color:#888;
    font-family:Arial,sans-serif;
    font-size:11px;
}

.info-value{
    margin-top:5px;
    font-size:13px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

/* URL */

.result{
    display:none;
    margin-top:20px;
}

.result-title{
    font-size:18px;
    margin-bottom:9px;
}

.url-box{
    display:flex;
    gap:8px;
    padding:8px;
    background:#080808;
    border:1px solid rgba(255,106,0,.38);
    border-radius:16px;
}

.url-input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    font-family:Arial,sans-serif;
    font-size:13px;
    padding:10px;
}

.btn{
    border:0;
    cursor:pointer;
    border-radius:12px;
    padding:11px 15px;
    font-family:"GFF-Latin-Bold",Arial,sans-serif;
    color:#fff;
    background:linear-gradient(135deg,#ff7200,#ff3b00);
    transition:.2s;
    white-space:nowrap;
}

.btn:hover{
    transform:translateY(-1px);
    filter:brightness(1.08);
}

.btn.secondary{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
}

.actions{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:12px;
}

/* MESSAGE */

.message{
    display:none;
    margin-top:14px;
    padding:13px 15px;
    border-radius:14px;
    font-family:Arial,sans-serif;
    font-size:13px;
    line-height:1.5;
}

.message.error{
    display:block;
    color:#ffb5a9;
    background:rgba(255,50,30,.08);
    border:1px solid rgba(255,70,50,.2);
}

.message.success{
    display:block;
    color:#bfffc9;
    background:rgba(50,255,100,.06);
    border:1px solid rgba(50,255,100,.15);
}

/* FOOTER */

.footer{
    text-align:center;
    padding:15px 20px 30px;
    color:#777;
    font-family:Arial,sans-serif;
    font-size:12px;
}

/* MOBILE */

@media(max-width:650px){

    .main-card{
        padding:15px;
        border-radius:22px;
    }

    .info{
        grid-template-columns:1fr;
    }

    .url-box{
        flex-direction:column;
    }

    .url-input{
        width:100%;
    }

    .actions{
        grid-template-columns:1fr;
    }

    .upload-box{
        min-height:190px;
    }

    .title{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div class="container">

<header class="header">

<img
    class="logo"
    src="https://cdn.imagetourls.com/uploads/tyImg/1ggIdgxtr.jpg"
    alt="FFVN.TGM">

<h1 class="title">
    FFVN.TGM - CÔNG CỤ CHÈN ẢNH TẠO LINK URL
</h1>

<p class="subtitle">
    Upload hình ảnh và tạo link URL trực tiếp nhanh chóng.
    Hỗ trợ Android, iPhone và máy tính.
</p>

</header>

<main class="main-card">

<label class="upload-box" for="fileInput">

    <div class="upload-icon">＋</div>

    <div class="upload-title">
        CHỌN HÌNH ẢNH
    </div>

    <div class="upload-desc">
        Nhấn để chọn ảnh từ Album hoặc thiết bị<br>
        PNG • JPG • JPEG • WEBP • GIF • AVIF<br>
        Dung lượng tối đa 4 MB
    </div>

</label>

<input
    id="fileInput"
    type="file"
    accept="image/png,image/jpeg,image/webp,image/gif,image/avif">

<section class="preview-section" id="previewSection">

    <img
        id="preview"
        class="preview"
        alt="Preview">

    <div class="info">

        <div class="info-item">
            <div class="info-label">TÊN FILE</div>
            <div class="info-value" id="fileName">-</div>
        </div>

        <div class="info-item">
            <div class="info-label">DUNG LƯỢNG</div>
            <div class="info-value" id="fileSize">-</div>
        </div>

        <div class="info-item">
            <div class="info-label">ĐỊNH DẠNG</div>
            <div class="info-value" id="fileType">-</div>
        </div>

    </div>

</section>

<section class="result" id="result">

    <div class="result-title">
        🔗 LINK URL ẢNH
    </div>

    <div class="url-box">

        <input
            id="urlInput"
            class="url-input"
            type="text"
            readonly>

        <button
            class="btn"
            id="copyBtn">
            SAO CHÉP
        </button>

    </div>

    <div class="actions">

        <button
            class="btn secondary"
            id="openBtn">
            MỞ ẢNH
        </button>

        <button
            class="btn secondary"
            id="htmlBtn">
            COPY HTML
        </button>

        <button
            class="btn secondary"
            id="newBtn">
            ẢNH MỚI
        </button>

    </div>

</section>

<div id="message" class="message"></div>

</main>

<footer class="footer">
    © 2026 FFVN.TGM - ALL RIGHTS RESERVED.
</footer>

</div>

<script>

const API_URL = "/api/upload";

const input = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const previewSection = document.getElementById("previewSection");

const result = document.getElementById("result");
const urlInput = document.getElementById("urlInput");

const fileName = document.getElementById("fileName");
const fileSize = document.getElementById("fileSize");
const fileType = document.getElementById("fileType");

const message = document.getElementById("message");

const copyBtn = document.getElementById("copyBtn");
const openBtn = document.getElementById("openBtn");
const htmlBtn = document.getElementById("htmlBtn");
const newBtn = document.getElementById("newBtn");

let currentURL = "";


/* =========================
   FORMAT SIZE
========================= */

function formatSize(bytes){

    if(bytes < 1024){
        return bytes + " B";
    }

    if(bytes < 1024 * 1024){
        return (bytes / 1024).toFixed(1) + " KB";
    }

    return (bytes / 1024 / 1024).toFixed(2) + " MB";
}


/* =========================
   RANDOM FILENAME
========================= */

function randomName(ext){

    const chars =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

    let random = "";

    for(let i = 0; i < 8; i++){
        random += chars[
            Math.floor(Math.random() * chars.length)
        ];
    }

    return random + "." + ext;
}


/* =========================
   MESSAGE
========================= */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;
}


/* =========================
   RESET
========================= */

function resetAll(){

    input.value = "";

    preview.removeAttribute("src");

    previewSection.style.display = "none";

    result.style.display = "none";

    urlInput.value = "";

    currentURL = "";

    message.className = "message";

    message.textContent = "";
}


/* =========================
   SELECT IMAGE
========================= */

input.addEventListener("change", async function(){

    const file = this.files[0];

    if(!file) return;


    /* CHECK SIZE */

    if(file.size > 4 * 1024 * 1024){

        showMessage(
            "❌ Hình ảnh vượt quá dung lượng tối đa 4 MB.",
            "error"
        );

        input.value = "";

        return;
    }


    /* CHECK TYPE */

    const allowed = [
        "image/png",
        "image/jpeg",
        "image/webp",
        "image/gif",
        "image/avif"
    ];

    if(!allowed.includes(file.type)){

        showMessage(
            "❌ Định dạng hình ảnh không được hỗ trợ.",
            "error"
        );

        input.value = "";

        return;
    }


    /* PREVIEW */

    const objectURL = URL.createObjectURL(file);

    preview.src = objectURL;

    previewSection.style.display = "block";

    fileName.textContent = file.name;

    fileSize.textContent = formatSize(file.size);

    fileType.textContent = file.type || "IMAGE";


    /*
       UPLOAD NGAY
       Không hiện loading/progress.
    */

    await uploadImage(file);

});


/* =========================
   UPLOAD
========================= */

async function uploadImage(file){

    try{

        const originalExt =
            file.name.split(".").pop().toLowerCase();

        const ext =
            originalExt === "jpeg"
                ? "jpg"
                : originalExt;


        const filename = randomName(ext);


        const formData = new FormData();

        formData.append(
            "file",
            file,
            filename
        );


        const response = await fetch(
            API_URL,
            {
                method:"POST",
                body:formData
            }
        );


        const data = await response.json();


        if(!response.ok || !data.success){

            throw new Error(
                data.error ||
                "Upload hình ảnh thất bại."
            );
        }


        /*
           URL CUSTOM CỦA WEBSITE
        */

        currentURL =
            "https://img-ffvn-tgm-com.vercel.app/images/" +
            encodeURIComponent(data.filename || filename);


        /*
           HIỆN LINK URL NGAY SAU KHI UPLOAD THÀNH CÔNG
        */

        urlInput.value = currentURL;

        result.style.display = "block";

        showMessage(
            "✅ Tạo link URL ảnh thành công.",
            "success"
        );


        /*
           Cuộn nhẹ xuống phần URL
        */

        setTimeout(() => {

            result.scrollIntoView({
                behavior:"smooth",
                block:"center"
            });

        },100);


    }catch(error){

        console.error(error);

        showMessage(
            "❌ " + (
                error.message ||
                "Không thể tạo link URL ảnh."
            ),
            "error"
        );

    }

}


/* =========================
   COPY URL
========================= */

copyBtn.addEventListener("click", async function(){

    if(!currentURL) return;

    try{

        await navigator.clipboard.writeText(currentURL);

        copyBtn.textContent = "ĐÃ SAO CHÉP";

        setTimeout(() => {
            copyBtn.textContent = "SAO CHÉP";
        },1500);

    }catch{

        urlInput.select();

        document.execCommand("copy");

    }

});


/* =========================
   OPEN IMAGE
========================= */

openBtn.addEventListener("click", function(){

    if(!currentURL) return;

    window.open(
        currentURL,
        "_blank",
        "noopener,noreferrer"
    );

});


/* =========================
   COPY HTML
========================= */

htmlBtn.addEventListener("click", async function(){

    if(!currentURL) return;

    const html =
        `<img src="${currentURL}" alt="FFVN.TGM">`;

    try{

        await navigator.clipboard.writeText(html);

        htmlBtn.textContent = "ĐÃ SAO CHÉP";

        setTimeout(() => {
            htmlBtn.textContent = "COPY HTML";
        },1500);

    }catch{

        alert(html);

    }

});


/* =========================
   NEW IMAGE
========================= */

newBtn.addEventListener("click", function(){

    resetAll();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

});

</script>

</body>
</html>
