<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>FFVN.TGM - CÔNG CỤ CHÈN ẢNH TẠO LINK URL</title>

<meta name="description" content="Công cụ chèn ảnh và tạo link URL trực tiếp nhanh chóng từ FFVN.TGM.">

<style>
@font-face{
    font-family:"GFF-Latin-Bold";
    src:
        url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2") format("woff2"),
        url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff") format("woff");
    font-display:swap;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    min-height:100%;
}

body{
    background:
        radial-gradient(circle at 10% 10%,rgba(255,90,0,.20),transparent 30%),
        radial-gradient(circle at 90% 90%,rgba(255,40,0,.14),transparent 30%),
        linear-gradient(135deg,#030303,#111,#050505);
    color:#fff;
    font-family:"GFF-Latin-Bold",Arial,sans-serif;
}

.container{
    width:min(950px,calc(100% - 24px));
    margin:auto;
    padding:25px 0 35px;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.badge{
    display:inline-block;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid rgba(255,100,0,.35);
    background:rgba(255,80,0,.08);
    color:#ff9a45;
    font-size:12px;
}

h1{
    margin-top:15px;
    font-size:clamp(24px,6vw,42px);
    line-height:1.1;
}

.header p{
    margin-top:10px;
    color:#999;
    font-family:Arial,sans-serif;
    font-size:14px;
    line-height:1.6;
}

.card{
    padding:18px;
    border-radius:25px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.045);
    backdrop-filter:blur(20px);
    box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.upload-zone{
    min-height:240px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    border:2px dashed rgba(255,100,0,.4);
    border-radius:20px;
    cursor:pointer;
    transition:.25s;
}

.upload-zone:hover,
.upload-zone.drag{
    border-color:#ff6500;
    background:rgba(255,70,0,.07);
}

.upload-icon{
    width:72px;
    height:72px;
    margin:auto auto 15px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:22px;
    font-size:32px;
    background:linear-gradient(135deg,#ff9800,#ff3d00);
}

.upload-content h2{
    font-size:20px;
}

.upload-content p{
    margin-top:9px;
    color:#999;
    font-family:Arial,sans-serif;
    font-size:13px;
}

#fileInput{
    display:none;
}

.preview{
    display:none;
    margin-top:18px;
}

.preview img{
    display:block;
    width:100%;
    max-height:400px;
    object-fit:contain;
    border-radius:18px;
    background:#050505;
}

.info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:12px;
}

.info-box{
    padding:13px;
    border-radius:14px;
    text-align:center;
    background:rgba(255,255,255,.04);
}

.info-box span{
    display:block;
    color:#777;
    font-family:Arial,sans-serif;
    font-size:11px;
    margin-bottom:5px;
}

.info-box strong{
    font-size:13px;
}

.url-result{
    display:none;
    margin-top:18px;
    padding:16px;
    border-radius:18px;
    background:rgba(0,255,120,.035);
    border:1px solid rgba(0,255,120,.20);
}

.url-title{
    color:#61ffab;
    margin-bottom:10px;
    font-size:16px;
}

.url-row{
    display:flex;
    gap:8px;
}

.url-input{
    flex:1;
    min-width:0;
    height:48px;
    padding:0 12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.10);
    background:#080808;
    color:#fff;
    outline:none;
    font-family:Arial,sans-serif;
    font-size:12px;
}

.btn{
    min-height:48px;
    padding:0 16px;
    border:0;
    border-radius:13px;
    color:#fff;
    font-family:inherit;
    cursor:pointer;
}

.btn-orange{
    background:linear-gradient(135deg,#ff9800,#ff3d00);
}

.btn-dark{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.08);
}

.buttons{
    display:flex;
    gap:9px;
    margin-top:10px;
}

.buttons .btn{
    flex:1;
}

.status{
    margin-top:12px;
    color:#aaa;
    font-family:Arial,sans-serif;
    font-size:12px;
}

.status.success{
    color:#61ffab;
}

.status.error{
    color:#ff7777;
}

.footer{
    text-align:center;
    color:#666;
    font-family:Arial,sans-serif;
    font-size:11px;
    padding-top:20px;
}

@media(max-width:600px){

    .container{
        width:calc(100% - 14px);
        padding-top:12px;
    }

    .card{
        padding:12px;
        border-radius:20px;
    }

    .info{
        grid-template-columns:1fr;
    }

    .url-row{
        flex-direction:column;
    }

    .buttons{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="container">

<header class="header">

    <div class="badge">
        🔥 FFVN.TGM • IMAGE URL TOOL
    </div>

    <h1>
        FFVN.TGM - CÔNG CỤ CHÈN ẢNH TẠO LINK URL
    </h1>

    <p>
        Chọn ảnh và nhận URL ngay lập tức.
        Hỗ trợ Android, iPhone và máy tính.
    </p>

</header>

<main class="card">

<label
    class="upload-zone"
    id="uploadZone"
    for="fileInput"
>

<div class="upload-content">

    <div class="upload-icon">
        📷
    </div>

    <h2>
        CHỌN HÌNH ẢNH
    </h2>

    <p>
        Nhấn để chọn ảnh từ Album
    </p>

    <p>
        PNG • JPG • JPEG • WEBP • GIF • AVIF • TỐI ĐA 4MB
    </p>

</div>

</label>

<input
    id="fileInput"
    type="file"
    accept="image/png,image/jpeg,image/jpg,image/webp,image/gif,image/avif"
>

<section
    class="preview"
    id="preview"
>

<img
    id="previewImage"
    alt="Preview"
>

<div class="info">

<div class="info-box">
<span>KÍCH THƯỚC</span>
<strong id="dimensions">-</strong>
</div>

<div class="info-box">
<span>TỶ LỆ</span>
<strong id="ratio">-</strong>
</div>

<div class="info-box">
<span>DUNG LƯỢNG</span>
<strong id="size">-</strong>
</div>

</div>

<div
    class="status"
    id="status"
>
    URL sẽ xuất hiện ngay khi chọn ảnh.
</div>

</section>

<section
    class="url-result"
    id="urlResult"
>

<div class="url-title">
    🔗 LINK URL HÌNH ẢNH
</div>

<div class="url-row">

<input
    class="url-input"
    id="urlInput"
    readonly
>

<button
    class="btn btn-orange"
    id="copyBtn"
>
    📋 SAO CHÉP
</button>

</div>

<div class="buttons">

<button
    class="btn btn-dark"
    id="openBtn"
>
    🔗 MỞ ẢNH
</button>

<button
    class="btn btn-dark"
    id="newBtn"
>
    ➕ ẢNH MỚI
</button>

</div>

</section>

</main>

<footer class="footer">
    © 2026 FFVN.TGM - ALL RIGHTS RESERVED.
</footer>

</div>

<script>
"use strict";

const MAX_SIZE = 4 * 1024 * 1024;

const TYPES = [
    "image/png",
    "image/jpeg",
    "image/jpg",
    "image/webp",
    "image/gif",
    "image/avif"
];

const fileInput =
    document.getElementById("fileInput");

const uploadZone =
    document.getElementById("uploadZone");

const preview =
    document.getElementById("preview");

const previewImage =
    document.getElementById("previewImage");

const dimensions =
    document.getElementById("dimensions");

const ratio =
    document.getElementById("ratio");

const size =
    document.getElementById("size");

const status =
    document.getElementById("status");

const urlResult =
    document.getElementById("urlResult");

const urlInput =
    document.getElementById("urlInput");

const copyBtn =
    document.getElementById("copyBtn");

const openBtn =
    document.getElementById("openBtn");

const newBtn =
    document.getElementById("newBtn");

let currentUrl = "";
let currentFile = null;
let uploading = false;

function bytes(value){

    if(value < 1024)
        return value + " B";

    if(value < 1024 * 1024)
        return (value / 1024).toFixed(1) + " KB";

    return (value / 1024 / 1024).toFixed(2) + " MB";
}

function gcd(a,b){

    while(b){

        const x = b;

        b = a % b;

        a = x;
    }

    return a;
}

function getRatio(w,h){

    const g = gcd(w,h);

    return `${w/g}:${h/g}`;
}

function extension(file){

    const type =
        String(file.type || "").toLowerCase();

    if(type === "image/jpeg" ||
       type === "image/jpg")
        return "jpg";

    if(type === "image/webp")
        return "webp";

    if(type === "image/gif")
        return "gif";

    if(type === "image/avif")
        return "avif";

    return "png";
}

function createFilename(file){

    const d = new Date();

    const date =
        d.getFullYear() +
        String(d.getMonth()+1).padStart(2,"0") +
        String(d.getDate()).padStart(2,"0");

    const time =
        String(d.getHours()).padStart(2,"0") +
        String(d.getMinutes()).padStart(2,"0") +
        String(d.getSeconds()).padStart(2,"0");

    const random =
        Math.random()
        .toString(36)
        .slice(2,12);

    return `images-${date}-${time}-${random}.${extension(file)}`;
}

function showStatus(text,type){

    status.textContent = text;

    status.className =
        "status " + (type || "");
}

function upload(file,filename){

    return new Promise((resolve,reject)=>{

        const xhr =
            new XMLHttpRequest();

        xhr.open(
            "POST",
            "/api/upload?filename=" +
            encodeURIComponent(filename),
            true
        );

        xhr.setRequestHeader(
            "Content-Type",
            file.type
        );

        xhr.onload = ()=>{

            let data = null;

            try{
                data = JSON.parse(xhr.responseText);
            }catch(e){}

            if(
                xhr.status >= 200 &&
                xhr.status < 300 &&
                data?.success
            ){

                resolve(data);

            }else{

                reject(
                    new Error(
                        data?.error ||
                        "Upload thất bại."
                    )
                );
            }
        };

        xhr.onerror = ()=>{

            reject(
                new Error(
                    "Không thể kết nối máy chủ."
                )
            );
        };

        xhr.send(file);
    });
}

async function selectFile(file){

    if(!file)
        return;

    if(!TYPES.includes(file.type)){

        showStatus(
            "Định dạng ảnh không được hỗ trợ.",
            "error"
        );

        return;
    }

    if(file.size > MAX_SIZE){

        showStatus(
            "Ảnh vượt quá giới hạn 4MB.",
            "error"
        );

        return;
    }

    currentFile = file;

    /*
      URL được tạo NGAY TẠI ĐÂY.
      Không chờ API.
    */

    const filename =
        createFilename(file);

    currentUrl =
        window.location.origin +
        "/images/" +
        encodeURIComponent(filename);

    urlInput.value =
        currentUrl;

    urlResult.style.display =
        "block";

    preview.style.display =
        "block";

    const objectUrl =
        URL.createObjectURL(file);

    previewImage.onload = ()=>{

        dimensions.textContent =
            previewImage.naturalWidth +
            " × " +
            previewImage.naturalHeight;

        ratio.textContent =
            getRatio(
                previewImage.naturalWidth,
                previewImage.naturalHeight
            );

        URL.revokeObjectURL(objectUrl);
    };

    previewImage.src =
        objectUrl;

    size.textContent =
        bytes(file.size);

    showStatus(
        "✅ LINK URL ĐÃ TẠO — ĐANG UPLOAD ẢNH...",
        ""
    );

    /*
      Upload chạy nền.
      Người dùng không phải chờ để thấy URL.
    */

    uploading = true;

    upload(file,filename)
        .then(data=>{

            uploading = false;

            /*
              Giữ URL đã tạo ở client.
              Server cũng trả URL để xác nhận.
            */

            if(data?.url){

                currentUrl =
                    data.url;

                urlInput.value =
                    currentUrl;
            }

            showStatus(
                "✅ UPLOAD THÀNH CÔNG — LINK ĐÃ SẴN SÀNG.",
                "success"
            );

        })
        .catch(error=>{

            uploading = false;

            /*
              URL vẫn được giữ lại.
              Người dùng có thể thử lại bằng
              cách chọn ảnh lại.
            */

            showStatus(
                "⚠️ URL ĐÃ TẠO NHƯNG UPLOAD CHƯA THÀNH CÔNG: " +
                error.message,
                "error"
            );
        });
}

fileInput.addEventListener(
    "change",
    ()=>{
        selectFile(
            fileInput.files?.[0]
        );
    }
);

uploadZone.addEventListener(
    "dragover",
    e=>{
        e.preventDefault();
        uploadZone.classList.add("drag");
    }
);

uploadZone.addEventListener(
    "dragleave",
    ()=>{
        uploadZone.classList.remove("drag");
    }
);

uploadZone.addEventListener(
    "drop",
    e=>{

        e.preventDefault();

        uploadZone.classList.remove("drag");

        selectFile(
            e.dataTransfer.files?.[0]
        );
    }
);

copyBtn.addEventListener(
    "click",
    async ()=>{

        if(!currentUrl)
            return;

        try{

            await navigator.clipboard.writeText(
                currentUrl
            );

        }catch(e){

            urlInput.select();

            document.execCommand("copy");
        }

        copyBtn.textContent =
            "✅ ĐÃ SAO CHÉP";

        setTimeout(()=>{
            copyBtn.textContent =
                "📋 SAO CHÉP";
        },1500);
    }
);

openBtn.addEventListener(
    "click",
    ()=>{

        if(currentUrl){

            window.open(
                currentUrl,
                "_blank"
            );
        }
    }
);

newBtn.addEventListener(
    "click",
    ()=>{

        fileInput.value = "";

        currentFile = null;
        currentUrl = "";
        uploading = false;

        preview.style.display =
            "none";

        urlResult.style.display =
            "none";

        previewImage.removeAttribute(
            "src"
        );

        showStatus(
            "URL sẽ xuất hiện ngay khi chọn ảnh.",
            ""
        );
    }
);

/*
  Không gọi API khi mở lại trang.
  Đây là phần sửa lỗi:
  "Không thể kết nối máy chủ"
*/

window.addEventListener(
    "pageshow",
    ()=>{
        uploading = false;
    }
);
</script>

</body>
</html>
