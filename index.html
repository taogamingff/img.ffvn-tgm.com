<script>

/* =========================================================
   ELEMENTS
========================================================= */

const fileInput =
    document.getElementById(
        "fileInput"
    );

const dropZone =
    document.getElementById(
        "dropZone"
    );

const uploadBtn =
    document.getElementById(
        "uploadBtn"
    );

const resetBtn =
    document.getElementById(
        "resetBtn"
    );

const previewBox =
    document.getElementById(
        "previewBox"
    );

const previewImage =
    document.getElementById(
        "previewImage"
    );

const imageBadge =
    document.getElementById(
        "imageBadge"
    );

const dimensions =
    document.getElementById(
        "dimensions"
    );

const ratio =
    document.getElementById(
        "ratio"
    );

const sizeInfo =
    document.getElementById(
        "sizeInfo"
    );

const progressWrap =
    document.getElementById(
        "progressWrap"
    );

const progress =
    document.getElementById(
        "progress"
    );

const progressText =
    document.getElementById(
        "progressText"
    );

const status =
    document.getElementById(
        "status"
    );

const result =
    document.getElementById(
        "result"
    );

const resultUrl =
    document.getElementById(
        "resultUrl"
    );

const copyBtn =
    document.getElementById(
        "copyBtn"
    );

const openBtn =
    document.getElementById(
        "openBtn"
    );


let selectedFile =
    null;


let imageWidth =
    0;


let imageHeight =
    0;


const MAX_SIZE =
    4 * 1024 * 1024;


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text,
    type = ""
){

    status.textContent =
        text;

    status.className =
        "status " + type;

}


/* =========================================================
   FORMAT BYTES
========================================================= */

function formatBytes(
    bytes
){

    if(
        bytes <
        1024
    ){

        return (
            bytes + " B"
        );

    }


    if(
        bytes <
        1024 * 1024
    ){

        return (
            bytes / 1024
        ).toFixed(1) +
        " KB";

    }


    return (
        bytes /
        1024 /
        1024
    ).toFixed(2) +
    " MB";

}


/* =========================================================
   GCD
========================================================= */

function gcd(
    a,
    b
){

    while(b){

        const temp =
            b;

        b =
            a % b;

        a =
            temp;

    }

    return a;

}


/* =========================================================
   DETECT RATIO
========================================================= */

function detectRatio(
    width,
    height
){

    const value =
        width / height;


    const known = [

        {
            name:"1:1",
            value:1
        },

        {
            name:"4:5",
            value:.8
        },

        {
            name:"3:4",
            value:.75
        },

        {
            name:"2:3",
            value:.6667
        },

        {
            name:"9:16",
            value:.5625
        },

        {
            name:"16:9",
            value:1.7778
        },

        {
            name:"4:3",
            value:1.3333
        },

        {
            name:"3:2",
            value:1.5
        },

        {
            name:"21:9",
            value:2.3333
        }

    ];


    let closest =
        known[0];


    let difference =
        Math.abs(
            value -
            closest.value
        );


    for(
        const item of known
    ){

        const current =
            Math.abs(
                value -
                item.value
            );


        if(
            current <
            difference
        ){

            closest =
                item;

            difference =
                current;

        }

    }


    /*
    | Nếu gần tỷ lệ chuẩn
    */

    if(
        difference <
        .04
    ){

        return closest.name;

    }


    /*
    | Tỷ lệ thực tế
    */

    const divisor =
        gcd(
            width,
            height
        );


    return (
        Math.round(
            width / divisor
        ) +
        ":" +
        Math.round(
            height / divisor
        )
    );

}


/* =========================================================
   DETECT ORIENTATION
========================================================= */

function detectOrientation(
    width,
    height
){

    if(
        width === height
    ){

        return "VUÔNG";

    }


    if(
        width > height
    ){

        return "NGANG";

    }


    return "DỌC";

}


/* =========================================================
   SELECT FILE
========================================================= */

function selectFile(
    file
){

    if(!file){

        return;

    }


    if(
        !file.type.startsWith(
            "image/"
        )
    ){

        setStatus(
            "❌ FILE KHÔNG PHẢI ẢNH.",
            "error"
        );

        return;

    }


    if(
        file.size >
        MAX_SIZE
    ){

        setStatus(
            "❌ ẢNH VƯỢT QUÁ 4MB.",
            "error"
        );

        return;

    }


    selectedFile =
        file;


    const objectUrl =
        URL.createObjectURL(
            file
        );


    const img =
        new Image();


    img.onload =
        function(){

            imageWidth =
                img.naturalWidth;

            imageHeight =
                img.naturalHeight;


            const detectedRatio =
                detectRatio(
                    imageWidth,
                    imageHeight
                );


            const orientation =
                detectOrientation(
                    imageWidth,
                    imageHeight
                );


            previewImage.src =
                objectUrl;


            dimensions.textContent =
                `${imageWidth} × ${imageHeight}`;


            ratio.textContent =
                detectedRatio;


            sizeInfo.textContent =
                formatBytes(
                    file.size
                );


            imageBadge.textContent =
                `${detectedRatio} • ${orientation}`;


            previewBox.style.display =
                "block";


            uploadBtn.disabled =
                false;


            resetBtn.style.display =
                "block";


            result.style.display =
                "none";


            setStatus(
                `✅ ĐÃ NHẬN DIỆN: ${detectedRatio} • ${orientation}`,
                "success"
            );

        };


    img.onerror =
        function(){

            URL.revokeObjectURL(
                objectUrl
            );


            setStatus(
                "❌ KHÔNG ĐỌC ĐƯỢC ẢNH.",
                "error"
            );

        };


    img.src =
        objectUrl;

}


/* =========================================================
   FILE INPUT
========================================================= */

fileInput.addEventListener(
    "change",
    function(){

        selectFile(
            this.files[0]
        );

    }
);


/* =========================================================
   DRAG & DROP
========================================================= */

dropZone.addEventListener(
    "dragover",
    function(e){

        e.preventDefault();

        dropZone.classList.add(
            "drag"
        );

    }
);


dropZone.addEventListener(
    "dragleave",
    function(){

        dropZone.classList.remove(
            "drag"
        );

    }
);


dropZone.addEventListener(
    "drop",
    function(e){

        e.preventDefault();

        dropZone.classList.remove(
            "drag"
        );


        selectFile(
            e.dataTransfer.files[0]
        );

    }
);


/* =========================================================
   RESET
========================================================= */

resetBtn.addEventListener(
    "click",
    function(){

        fileInput.value =
            "";

        selectedFile =
            null;


        previewBox.style.display =
            "none";


        result.style.display =
            "none";


        progressWrap.style.display =
            "none";


        resetBtn.style.display =
            "none";


        uploadBtn.disabled =
            true;


        progress.style.width =
            "0%";


        progressText.textContent =
            "0%";


        setStatus("");

    }
);


/* =========================================================
   CONVERT TO PNG
========================================================= */

function convertToPng(
    file
){

    /*
    | PNG giữ chất lượng.
    | Nếu file đã là PNG thì gửi trực tiếp.
    */

    if(
        file.type ===
        "image/png"
    ){

        return Promise.resolve(
            file
        );

    }


    return new Promise(
        (
            resolve,
            reject
        ) => {

            const reader =
                new FileReader();


            reader.onload =
                function(){

                    const img =
                        new Image();


                    img.onload =
                        function(){

                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                img.naturalWidth;


                            canvas.height =
                                img.naturalHeight;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                img,
                                0,
                                0
                            );


                            canvas.toBlob(
                                function(blob){

                                    if(!blob){

                                        reject(
                                            new Error(
                                                "KHÔNG THỂ TẠO PNG."
                                            )
                                        );

                                        return;

                                    }


                                    resolve(
                                        blob
                                    );

                                },
                                "image/png"
                            );

                        };


                    img.onerror =
                        function(){

                            reject(
                                new Error(
                                    "KHÔNG ĐỌC ĐƯỢC ẢNH."
                                )
                            );

                        };


                    img.src =
                        reader.result;

                };


            reader.onerror =
                function(){

                    reject(
                        new Error(
                            "KHÔNG ĐỌC ĐƯỢC FILE."
                        )
                    );

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =========================================================
   UPLOAD
========================================================= */

uploadBtn.addEventListener(
    "click",
    async function(){

        if(!selectedFile){

            return;

        }


        uploadBtn.disabled =
            true;


        resetBtn.style.display =
            "none";


        progressWrap.style.display =
            "block";


        result.style.display =
            "none";


        progress.style.width =
            "5%";


        progressText.textContent =
            "5%";


        setStatus(
            "⏳ ĐANG CHUẨN BỊ..."
        );


        try{

            /*
            | PNG
            */

            const pngBlob =
                await convertToPng(
                    selectedFile
                );


            if(
                pngBlob.size >
                MAX_SIZE
            ){

                throw new Error(
                    "ẢNH SAU KHI XỬ LÝ VƯỢT QUÁ 4MB."
                );

            }


            progress.style.width =
                "15%";


            progressText.textContent =
                "15%";


            setStatus(
                "⚡ ĐANG UPLOAD..."
            );


            /*
            |--------------------------------------------------------------------------
            | XHR
            |--------------------------------------------------------------------------
            */

            const xhr =
                new XMLHttpRequest();


            xhr.open(
                "POST",
                "/api/upload",
                true
            );


            xhr.setRequestHeader(
                "Content-Type",
                "image/png"
            );


            xhr.timeout =
                15000;


            /*
            |--------------------------------------------------------------------------
            | Upload progress
            |--------------------------------------------------------------------------
            */

            xhr.upload.onprogress =
                function(e){

                    if(
                        e.lengthComputable
                    ){

                        const percent =
                            15 +
                            Math.round(
                                (
                                    e.loaded /
                                    e.total
                                ) * 80
                            );


                        progress.style.width =
                            percent + "%";


                        progressText.textContent =
                            percent + "%";

                    }

                };


            /*
            |--------------------------------------------------------------------------
            | Success
            |--------------------------------------------------------------------------
            */

            xhr.onload =
                function(){

                    let data =
                        null;


                    try{

                        data =
                            JSON.parse(
                                xhr.responseText
                            );

                    }catch{

                        data =
                            null;

                    }


                    if(
                        xhr.status >= 200 &&
                        xhr.status < 300 &&
                        data?.success
                    ){

                        progress.style.width =
                            "100%";


                        progressText.textContent =
                            "100%";


                        resultUrl.value =
                            data.url;


                        result.style.display =
                            "block";


                        setStatus(
                            "✅ UPLOAD THÀNH CÔNG!",
                            "success"
                        );


                    }else{

                        const message =
                            data?.error ||
                            "UPLOAD THẤT BẠI.";


                        setStatus(
                            "❌ " +
                            message,
                            "error"
                        );


                        progressWrap.style.display =
                            "none";

                    }


                    uploadBtn.disabled =
                        false;


                    resetBtn.style.display =
                        "block";

                };


            /*
            |--------------------------------------------------------------------------
            | Error
            |--------------------------------------------------------------------------
            */

            xhr.onerror =
                function(){

                    setStatus(
                        "❌ KHÔNG KẾT NỐI ĐƯỢC API.",
                        "error"
                    );


                    progressWrap.style.display =
                        "none";


                    uploadBtn.disabled =
                        false;


                    resetBtn.style.display =
                        "block";

                };


            /*
            |--------------------------------------------------------------------------
            | Timeout
            |--------------------------------------------------------------------------
            */

            xhr.ontimeout =
                function(){

                    setStatus(
                        "❌ UPLOAD QUÁ THỜI GIAN CHỜ.",
                        "error"
                    );


                    progressWrap.style.display =
                        "none";


                    uploadBtn.disabled =
                        false;


                    resetBtn.style.display =
                        "block";

                };


            xhr.send(
                pngBlob
            );

        }catch(error){

            console.error(
                error
            );


            setStatus(
                "❌ " +
                (
                    error.message ||
                    "UPLOAD THẤT BẠI."
                ),
                "error"
            );


            progressWrap.style.display =
                "none";


            uploadBtn.disabled =
                false;


            resetBtn.style.display =
                "block";

        }

    }
);


/* =========================================================
   COPY
========================================================= */

copyBtn.addEventListener(
    "click",
    async function(){

        const url =
            resultUrl.value;


        if(!url){

            return;

        }


        try{

            await navigator.clipboard.writeText(
                url
            );

        }catch{

            resultUrl.select();

            document.execCommand(
                "copy"
            );

        }


        copyBtn.textContent =
            "ĐÃ COPY";


        setTimeout(
            function(){

                copyBtn.textContent =
                    "COPY";

            },
            1500
        );

    }
);


/* =========================================================
   OPEN
========================================================= */

openBtn.addEventListener(
    "click",
    function(){

        const url =
            resultUrl.value;


        if(url){

            window.open(
                url,
                "_blank"
            );

        }

    }
);
