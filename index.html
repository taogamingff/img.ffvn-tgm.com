<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>FFVN.TGM - CÔNG CỤ CHÈN ẢNH TẠO LINK URL</title>

<meta
    name="description"
    content="Công cụ chèn ảnh và tạo link URL trực tiếp nhanh chóng từ FFVN.TGM."
>

<style>
@font-face{
    font-family:"GFF-Latin-Bold";
    src:
        url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2") format("woff2"),
        url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff") format("woff");
    font-display:swap;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    min-height:100%;
    background:#050505;
}

body{
    min-height:100vh;
    color:#fff;
    font-family:"GFF-Latin-Bold",Arial,sans-serif;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(255,100,0,.20),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(255,40,0,.16),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #030303,
            #111,
            #050505
        );

    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
        repeating-linear-gradient(
            135deg,
            rgba(255,255,255,.012) 0,
            rgba(255,255,255,.012) 1px,
            transparent 1px,
            transparent 7px
        );
}

.container{
    width:min(950px,calc(100% - 24px));
    margin:auto;
    padding:25px 0 35px;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.badge{
    display:inline-flex;
    padding:8px 14px;
    border-radius:999px;

    border:1px solid rgba(255,100,0,.35);

    background:rgba(255,80,0,.08);

    color:#ff9b4a;

    font-size:12px;
}

.header h1{
    margin-top:15px;

    font-size:
        clamp(24px,6vw,42px);

    line-height:1.1;

    text-shadow:
        0 0 30px rgba(255,80,0,.25);
}

.header p{
    margin-top:10px;

    color:#999;

    font-family:Arial,sans-serif;

    font-size:14px;

    line-height:1.6;
}

.card{
    position:relative;

    padding:18px;

    border-radius:25px;

    border:1px solid rgba(255,255,255,.08);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.07),
            rgba(255,255,255,.025)
        );

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    box-shadow:
        0 25px 80px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.08);
}

.upload-zone{
    min-height:245px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    border:2px dashed rgba(255,100,0,.40);

    border-radius:20px;

    cursor:pointer;

    transition:.25s;

    background:rgba(255,80,0,.025);
}

.upload-zone:hover,
.upload-zone.drag{
    border-color:#ff6900;

    background:rgba(255,80,0,.07);

    box-shadow:
        0 0 35px rgba(255,80,0,.10);
}

.upload-content{
    padding:25px;
}

.upload-icon{
    width:75px;
    height:75px;

    margin:0 auto 15px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:22px;

    font-size:34px;

    background:
        linear-gradient(
            135deg,
            #ff9800,
            #ff3d00
        );

    box-shadow:
        0 12px 35px rgba(255,70,0,.25);
}

.upload-content h2{
    font-size:20px;
}

.upload-content p{
    margin-top:9px;

    color:#999;

    font-family:Arial,sans-serif;

    font-size:13px;
}

#fileInput{
    display:none;
}

.preview{
    display:none;
    margin-top:18px;
}

.preview-image{
    display:block;

    width:100%;

    max-height:400px;

    object-fit:contain;

    border-radius:18px;

    background:#050505;

    border:1px solid rgba(255,255,255,.08);
}

.info-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

    margin-top:12px;
}

.info-box{
    padding:13px;

    text-align:center;

    border-radius:14px;

    background:
        rgba(255,255,255,.04);

    border:1px solid
        rgba(255,255,255,.06);
}

.info-box span{
    display:block;

    margin-bottom:5px;

    color:#777;

    font-family:Arial,sans-serif;

    font-size:11px;
}

.info-box strong{
    font-size:13px;
}

.status{
    min-height:20px;

    margin-top:12px;

    color:#999;

    font-family:Arial,sans-serif;

    font-size:12px;

    line-height:1.5;
}

.status.success{
    color:#5dffab;
}

.status.error{
    color:#ff7373;
}

.progress{
    display:none;

    margin-top:12px;
}

.progress-track{
    width:100%;
    height:9px;

    padding:2px;

    border-radius:99px;

    background:#191919;

    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;

    border-radius:99px;

    background:
        linear-gradient(
            90deg,
            #ff3d00,
            #ffab42
        );

    transition:
        width .15s linear;

    box-shadow:
        0 0 15px
        rgba(255,90,0,.5);
}

.progress-text{
    margin-top:6px;

    color:#888;

    font-family:Arial,sans-serif;

    font-size:11px;
}

.result{
    display:none;

    margin-top:18px;

    padding:17px;

    border-radius:18px;

    background:
        rgba(0,255,120,.035);

    border:1px solid
        rgba(0,255,120,.20);
}

.result-title{
    margin-bottom:10px;

    color:#61ffab;

    font-size:16px;
}

.url-row{
    display:flex;

    gap:8px;
}

.url-input{
    flex:1;

    min-width:0;

    height:48px;

    padding:0 12px;

    border-radius:12px;

    border:1px solid
        rgba(255,255,255,.10);

    background:#080808;

    color:#fff;

    outline:none;

    font-family:Arial,sans-serif;

    font-size:12px;
}

.btn{
    min-height:48px;

    padding:0 16px;

    border:0;

    border-radius:13px;

    color:#fff;

    font-family:inherit;

    cursor:pointer;

    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-orange{
    background:
        linear-gradient(
            135deg,
            #ff9800,
            #ff3d00
        );

    box-shadow:
        0 8px 25px
        rgba(255,70,0,.18);
}

.btn-dark{
    background:
        rgba(255,255,255,.07);

    border:
        1px solid
        rgba(255,255,255,.08);
}

.result-buttons{
    display:flex;

    gap:8px;

    margin-top:10px;
}

.result-buttons .btn{
    flex:1;
}

.footer{
    padding-top:22px;

    text-align:center;

    color:#666;

    font-family:Arial,sans-serif;

    font-size:11px;
}

@media(max-width:600px){

    .container{
        width:calc(100% - 14px);
        padding-top:12px;
    }

    .card{
        padding:12px;
        border-radius:20px;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .url-row{
        flex-direction:column;
    }

    .result-buttons{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="container">

<header class="header">

    <div class="badge">
        🔥 FFVN.TGM • IMAGE URL TOOL
    </div>

    <h1>
        FFVN.TGM - CÔNG CỤ CHÈN ẢNH TẠO LINK URL
    </h1>

    <p>
        Upload hình ảnh và tạo link URL trực tiếp.
        Hỗ trợ Android, iPhone và máy tính.
    </p>

</header>

<main class="card">

<label
    class="upload-zone"
    id="uploadZone"
    for="fileInput"
>

<div class="upload-content">

    <div class="upload-icon">
        📷
    </div>

    <h2>
        CHỌN HÌNH ẢNH
    </h2>

    <p>
        Nhấn để chọn ảnh từ Album
    </p>

    <p>
        PNG • JPG • JPEG • WEBP • GIF • AVIF • TỐI ĐA 4MB
    </p>

</div>

</label>

<input
    id="fileInput"
    type="file"
    accept="image/png,image/jpeg,image/jpg,image/webp,image/gif,image/avif"
>

<section
    class="preview"
    id="preview"
>

<img
    id="previewImage"
    class="preview-image"
    alt="Preview"
>

<div class="info-grid">

<div class="info-box">
<span>KÍCH THƯỚC</span>
<strong id="dimensions">-</strong>
</div>

<div class="info-box">
<span>TỶ LỆ</span>
<strong id="ratio">-</strong>
</div>

<div class="info-box">
<span>DUNG LƯỢNG</span>
<strong id="size">-</strong>
</div>

</div>

<div
    class="progress"
    id="progress"
>

<div class="progress-track">

<div
    class="progress-bar"
    id="progressBar"
></div>

</div>

<div
    class="progress-text"
    id="progressText"
>
    ĐANG CHUẨN BỊ...
</div>

</div>

<div
    class="status"
    id="status"
>
    Đang chờ hình ảnh...
</div>

</section>

<section
    class="result"
    id="result"
>

<div class="result-title">
    ✅ UPLOAD THÀNH CÔNG
</div>

<div class="url-row">

<input
    id="urlInput"
    class="url-input"
    type="text"
    readonly
>

<button
    id="copyBtn"
    class="btn btn-orange"
    type="button"
>
    📋 SAO CHÉP
</button>

</div>

<div class="result-buttons">

<button
    id="openBtn"
    class="btn btn-dark"
    type="button"
>
    🔗 MỞ ẢNH
</button>

<button
    id="newBtn"
    class="btn btn-dark"
    type="button"
>
    ➕ ẢNH MỚI
</button>

</div>

</section>

</main>

<footer class="footer">
    © 2026 FFVN.TGM - ALL RIGHTS RESERVED.
</footer>

</div>

<script>
"use strict";

const MAX_SIZE =
    4 * 1024 * 1024;

const ALLOWED_TYPES = [
    "image/png",
    "image/jpeg",
    "image/jpg",
    "image/webp",
    "image/gif",
    "image/avif"
];

const fileInput =
    document.getElementById("fileInput");

const uploadZone =
    document.getElementById("uploadZone");

const preview =
    document.getElementById("preview");

const previewImage =
    document.getElementById("previewImage");

const dimensions =
    document.getElementById("dimensions");

const ratio =
    document.getElementById("ratio");

const size =
    document.getElementById("size");

const status =
    document.getElementById("status");

const progress =
    document.getElementById("progress");

const progressBar =
    document.getElementById("progressBar");

const progressText =
    document.getElementById("progressText");

const result =
    document.getElementById("result");

const urlInput =
    document.getElementById("urlInput");

const copyBtn =
    document.getElementById("copyBtn");

const openBtn =
    document.getElementById("openBtn");

const newBtn =
    document.getElementById("newBtn");

let currentUrl = "";

function formatBytes(bytes){

    if(bytes < 1024){
        return bytes + " B";
    }

    if(bytes < 1024 * 1024){
        return (
            bytes / 1024
        ).toFixed(1) + " KB";
    }

    return (
        bytes /
        1024 /
        1024
    ).toFixed(2) + " MB";
}

function gcd(a,b){

    while(b){

        const temp = b;

        b = a % b;

        a = temp;
    }

    return a;
}

function getRatio(w,h){

    const g = gcd(w,h);

    return `${w/g}:${h/g}`;
}

function getExtension(file){

    switch(
        String(file.type || "")
            .toLowerCase()
    ){

        case "image/jpeg":
        case "image/jpg":
            return "jpg";

        case "image/webp":
            return "webp";

        case "image/gif":
            return "gif";

        case "image/avif":
            return "avif";

        default:
            return "png";
    }
}

/*
    Tạo mã cực ngắn.

    Ví dụ:
    a7K29xPq.png
*/

function createShortId(){

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ" +
        "abcdefghijkmnopqrstuvwxyz" +
        "23456789";

    let id = "";

    for(let i=0;i<8;i++){

        id += chars[
            Math.floor(
                Math.random() *
                chars.length
            )
        ];
    }

    return id;
}

function createFilename(file){

    return (
        createShortId() +
        "." +
        getExtension(file)
    );
}

function setStatus(text,type){

    status.textContent = text;

    status.className =
        "status " +
        (type || "");
}

function setProgress(percent,text){

    progress.style.display =
        "block";

    progressBar.style.width =
        percent + "%";

    progressText.textContent =
        text;
}

function uploadFile(file,filename){

    return new Promise(
        (resolve,reject)=>{

            const xhr =
                new XMLHttpRequest();

            xhr.open(
                "POST",
                "/api/upload?filename=" +
                encodeURIComponent(filename),
                true
            );

            xhr.setRequestHeader(
                "Content-Type",
                file.type
            );

            xhr.onload = function(){

                let data = null;

                try{

                    data =
                        JSON.parse(
                            xhr.responseText
                        );

                }catch(error){}

                if(
                    xhr.status >= 200 &&
                    xhr.status < 300 &&
                    data?.success
                ){

                    resolve(data);

                    return;
                }

                reject(
                    new Error(
                        data?.error ||
                        "Upload thất bại."
                    )
                );
            };

            xhr.onerror = function(){

                reject(
                    new Error(
                        "Không thể kết nối máy chủ."
                    )
                );
            };

            xhr.onabort = function(){

                reject(
                    new Error(
                        "Upload đã bị hủy."
                    )
                );
            };

            xhr.send(file);
        }
    );
}

async function handleFile(file){

    if(!file){
        return;
    }

    result.style.display =
        "none";

    currentUrl = "";

    if(!ALLOWED_TYPES.includes(file.type)){

        setStatus(
            "❌ Định dạng ảnh không được hỗ trợ.",
            "error"
        );

        return;
    }

    if(file.size > MAX_SIZE){

        setStatus(
            "❌ Ảnh vượt quá giới hạn 4MB.",
            "error"
        );

        return;
    }

    preview.style.display =
        "block";

    setStatus(
        "Đang đọc hình ảnh..."
    );

    size.textContent =
        formatBytes(file.size);

    const objectUrl =
        URL.createObjectURL(file);

    previewImage.onload =
        function(){

            dimensions.textContent =
                previewImage.naturalWidth +
                " × " +
                previewImage.naturalHeight;

            ratio.textContent =
                getRatio(
                    previewImage.naturalWidth,
                    previewImage.naturalHeight
                );

            URL.revokeObjectURL(
                objectUrl
            );
        };

    previewImage.src =
        objectUrl;

    /*
      Mã ảnh ngắn.
    */

    const filename =
        createFilename(file);

    /*
      URL ngắn được tạo.
    */

    currentUrl =
        window.location.origin +
        "/images/" +
        encodeURIComponent(filename);

    setStatus(
        "Đang tải hình ảnh lên máy chủ..."
    );

    setProgress(
        5,
        "ĐANG CHUẨN BỊ..."
    );

    /*
      Tiến trình giao diện chạy riêng,
      tránh bị kẹt ở 97%.
    */

    let visualProgress = 5;

    const timer =
        setInterval(()=>{

            if(visualProgress < 92){

                visualProgress += 3;

                setProgress(
                    visualProgress,
                    "ĐANG UPLOAD..."
                );
            }

        },120);

    try{

        const data =
            await uploadFile(
                file,
                filename
            );

        clearInterval(timer);

        setProgress(
            100,
            "UPLOAD 100% • HOÀN TẤT"
        );

        /*
          Chỉ hiện URL sau khi Blob
          xác nhận upload thành công.
        */

        currentUrl =
            data.url ||
            currentUrl;

        urlInput.value =
            currentUrl;

        result.style.display =
            "block";

        setStatus(
            "✅ Upload thành công. Link URL đã sẵn sàng.",
            "success"
        );

        /*
          Lưu link cuối cùng để giao diện
          không phụ thuộc vào API khi reload.
        */

        try{

            localStorage.setItem(
                "ffvn_last_image_url",
                currentUrl
            );

        }catch(error){}

    }catch(error){

        clearInterval(timer);

        setProgress(
            0,
            "UPLOAD THẤT BẠI"
        );

        setStatus(
            "❌ " +
            (
                error?.message ||
                "Không thể kết nối máy chủ."
            ),
            "error"
        );
    }
}

fileInput.addEventListener(
    "change",
    function(){

        handleFile(
            this.files?.[0]
        );
    }
);

uploadZone.addEventListener(
    "dragover",
    function(event){

        event.preventDefault();

        uploadZone.classList.add(
            "drag"
        );
    }
);

uploadZone.addEventListener(
    "dragleave",
    function(){

        uploadZone.classList.remove(
            "drag"
        );
    }
);

uploadZone.addEventListener(
    "drop",
    function(event){

        event.preventDefault();

        uploadZone.classList.remove(
            "drag"
        );

        handleFile(
            event.dataTransfer.files?.[0]
        );
    }
);

copyBtn.addEventListener(
    "click",
    async function(){

        if(!currentUrl){
            return;
        }

        try{

            await navigator.clipboard.writeText(
                currentUrl
            );

        }catch(error){

            urlInput.select();

            document.execCommand(
                "copy"
            );
        }

        copyBtn.textContent =
            "✅ ĐÃ SAO CHÉP";

        setTimeout(
            ()=>{
                copyBtn.textContent =
                    "📋 SAO CHÉP";
            },
            1500
        );
    }
);

openBtn.addEventListener(
    "click",
    function(){

        if(!currentUrl){
            return;
        }

        window.open(
            currentUrl,
            "_blank",
            "noopener"
        );
    }
);

newBtn.addEventListener(
    "click",
    function(){

        fileInput.value = "";

        currentUrl = "";

        preview.style.display =
            "none";

        result.style.display =
            "none";

        progress.style.display =
            "none";

        previewImage.removeAttribute(
            "src"
        );

        dimensions.textContent = "-";
        ratio.textContent = "-";
        size.textContent = "-";

        setStatus(
            "Đang chờ hình ảnh..."
        );
    }
);

/*
  Không gọi API khi trang được mở lại.
  Vì vậy reload / thoát vào lại trang
  không gây lỗi kết nối API.
*/

window.addEventListener(
    "pageshow",
    function(){
        /* intentionally empty */
    }
);
</script>

</body>
</html>
