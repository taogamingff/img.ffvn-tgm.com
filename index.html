<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>
  FFVN.TGM IMAGE HOSTING 🔥
</title>

<meta
  name="description"
  content="FFVN.TGM Image Hosting - Upload và lưu trữ hình ảnh nhanh chóng."
>

<style>

/* =========================================================
   GFF FONT
========================================================= */

@font-face{

  font-family:"GFF-Latin-Bold";

  src:
    url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2")
      format("woff2"),

    url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff")
      format("woff");

  font-display:swap;
}


/* =========================================================
   RESET
========================================================= */

*{

  box-sizing:border-box;

  margin:0;

  padding:0;

  font-family:"GFF-Latin-Bold", sans-serif;

  -webkit-font-smoothing:antialiased;

  text-rendering:optimizeLegibility;
}


html,
body{

  width:100%;

  min-height:100%;

  font-family:"GFF-Latin-Bold", sans-serif;
}


/* =========================================================
   BACKGROUND
========================================================= */

body{

  min-height:100vh;

  color:#fff;

  background:

    radial-gradient(
      circle at 10% 10%,
      rgba(255,110,0,.30),
      transparent 30%
    ),

    radial-gradient(
      circle at 90% 20%,
      rgba(255,40,0,.20),
      transparent 30%
    ),

    radial-gradient(
      circle at 50% 100%,
      rgba(255,145,0,.18),
      transparent 35%
    ),

    linear-gradient(
      135deg,
      #050505,
      #101010 45%,
      #050505
    );

  overflow-x:hidden;
}


/* =========================================================
   LIGHT EFFECT
========================================================= */

body::before{

  content:"";

  position:fixed;

  inset:-50%;

  pointer-events:none;

  background:

    radial-gradient(
      circle,
      rgba(255,100,0,.07),
      transparent 45%
    );

  animation:
    rotateLight 18s linear infinite;

}


@keyframes rotateLight{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}


/* =========================================================
   APP
========================================================= */

.app{

  position:relative;

  z-index:1;

  width:100%;

  max-width:900px;

  margin:auto;

  padding:
    24px
    16px
    40px;
}


/* =========================================================
   HEADER
========================================================= */

.header{

  text-align:center;

  padding:18px 10px 24px;
}


.logo{

  width:82px;

  height:82px;

  object-fit:cover;

  border-radius:24px;

  border:2px solid rgba(255,140,0,.75);

  box-shadow:

    0 0 30px
      rgba(255,100,0,.30),

    inset 0 0 20px
      rgba(255,255,255,.08);
}


.title{

  margin-top:16px;

  font-size:
    clamp(25px,7vw,46px);

  letter-spacing:.5px;

  color:#fff;

  text-shadow:

    0 0 15px
      rgba(255,90,0,.5);
}


.subtitle{

  margin-top:8px;

  opacity:.72;

  font-size:14px;

  line-height:1.6;
}


/* =========================================================
   CARD
========================================================= */

.card{

  border:

    1px solid
    rgba(255,255,255,.12);

  border-radius:28px;

  padding:22px;

  background:

    linear-gradient(
      145deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.025)
    );

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);

  box-shadow:

    0 25px 80px
      rgba(0,0,0,.40),

    inset 0 1px 0
      rgba(255,255,255,.08);
}


/* =========================================================
   DROP AREA
========================================================= */

.drop{

  position:relative;

  min-height:270px;

  border:

    2px dashed
    rgba(255,125,0,.45);

  border-radius:22px;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:30px;

  cursor:pointer;

  transition:.25s ease;

  background:

    rgba(255,255,255,.025);
}


.drop:hover,
.drop.active{

  border-color:#ff8a00;

  background:
    rgba(255,110,0,.07);

  box-shadow:

    0 0 40px
      rgba(255,90,0,.12);
}


.drop-icon{

  font-size:52px;

  margin-bottom:12px;
}


.drop-title{

  font-size:21px;
}


.drop-desc{

  margin-top:8px;

  font-size:13px;

  opacity:.62;

  line-height:1.6;
}


input[type=file]{

  display:none;
}


/* =========================================================
   PREVIEW
========================================================= */

.preview{

  display:none;

  margin-top:20px;

  overflow:hidden;

  border-radius:20px;

  background:#050505;

  border:
    1px solid
    rgba(255,255,255,.1);
}


.preview.show{

  display:block;
}


.preview img{

  display:block;

  width:100%;

  max-height:420px;

  object-fit:contain;

  background:

    repeating-conic-gradient(
      #181818 0% 25%,
      #101010 0% 50%
    )
    50% / 20px 20px;
}


/* =========================================================
   INFO
========================================================= */

.info{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;

  margin-top:14px;
}


.info-box{

  padding:13px;

  border-radius:15px;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid
    rgba(255,255,255,.07);

  text-align:center;
}


.info-label{

  display:block;

  font-size:10px;

  opacity:.55;

  margin-bottom:5px;
}


.info-value{

  font-size:13px;
}


/* =========================================================
   BUTTON
========================================================= */

.button{

  width:100%;

  margin-top:18px;

  min-height:58px;

  border:0;

  border-radius:18px;

  cursor:pointer;

  font-size:17px;

  color:#fff;

  background:

    linear-gradient(
      135deg,
      #ff4d00,
      #ff9d00
    );

  box-shadow:

    0 10px 30px
      rgba(255,80,0,.22);

  transition:.2s ease;
}


.button:hover{

  transform:
    translateY(-2px);

  box-shadow:

    0 15px 35px
      rgba(255,80,0,.30);
}


.button:disabled{

  opacity:.5;

  cursor:not-allowed;

  transform:none;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-box{

  display:none;

  margin-top:20px;
}


.progress-box.show{

  display:block;
}


.progress-top{

  display:flex;

  justify-content:space-between;

  font-size:13px;

  margin-bottom:8px;

  opacity:.85;
}


.progress{

  width:100%;

  height:10px;

  overflow:hidden;

  border-radius:20px;

  background:
    rgba(255,255,255,.08);
}


.progress-bar{

  width:0%;

  height:100%;

  border-radius:20px;

  background:

    linear-gradient(
      90deg,
      #ff4b00,
      #ffb000
    );

  transition:
    width .15s linear;
}


/* =========================================================
   RESULT
========================================================= */

.result{

  display:none;

  margin-top:20px;

  padding:18px;

  border-radius:20px;

  background:
    rgba(50,255,130,.05);

  border:
    1px solid
    rgba(80,255,140,.20);
}


.result.show{

  display:block;
}


.result-title{

  font-size:18px;

  margin-bottom:10px;
}


.url{

  width:100%;

  padding:13px;

  border-radius:13px;

  background:#050505;

  border:
    1px solid
    rgba(255,255,255,.08);

  color:#fff;

  font-size:12px;

  word-break:break-all;

  line-height:1.6;
}


.actions{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;

  margin-top:12px;
}


.action{

  min-height:48px;

  border:0;

  border-radius:14px;

  cursor:pointer;

  color:#fff;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid
    rgba(255,255,255,.08);

  font-size:13px;
}


/* =========================================================
   STATUS
========================================================= */

.status{

  margin-top:14px;

  min-height:22px;

  text-align:center;

  font-size:13px;

  opacity:.78;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{

  text-align:center;

  padding:25px 0 5px;

  font-size:11px;

  opacity:.45;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

  .app{

    padding:
      12px
      12px
      30px;
  }

  .card{

    padding:14px;

    border-radius:22px;
  }

  .drop{

    min-height:230px;
  }

  .info{

    grid-template-columns:
      1fr;
  }

  .actions{

    grid-template-columns:
      1fr;
  }

}

</style>

</head>


<body>

<main class="app">

  <header class="header">

    <img
      class="logo"
      src="https://cdn.imagetourls.com/uploads/tyImg/1ggIdgxtr.jpg"
      alt="FFVN.TGM"
    >

    <h1 class="title">
      FFVN.TGM IMAGE HOSTING 🔥
    </h1>

    <p class="subtitle">
      Upload hình ảnh nhanh chóng • Tự động tạo URL • Không cần đổi tên thủ công
    </p>

  </header>


  <section class="card">

    <label
      class="drop"
      id="drop"
      for="file"
    >

      <div>

        <div class="drop-icon">
          🖼️
        </div>

        <div class="drop-title">
          CHỌN HÌNH ẢNH
        </div>

        <div class="drop-desc">
          Nhấn để chọn ảnh từ Album<br>
          PNG • JPG • JPEG • WEBP • tối đa 4MB
        </div>

      </div>

    </label>


    <input
      id="file"
      type="file"
      accept="image/*"
    >


    <div
      class="preview"
      id="preview"
    >

      <img
        id="previewImage"
        alt="Preview"
      >

    </div>


    <div
      class="info"
      id="info"
    >

      <div class="info-box">

        <span class="info-label">
          KÍCH THƯỚC
        </span>

        <span
          class="info-value"
          id="dimensions"
        >
          —
        </span>

      </div>


      <div class="info-box">

        <span class="info-label">
          TỶ LỆ
        </span>

        <span
          class="info-value"
          id="ratio"
        >
          —
        </span>

      </div>


      <div class="info-box">

        <span class="info-label">
          DUNG LƯỢNG
        </span>

        <span
          class="info-value"
          id="size"
        >
          —
        </span>

      </div>

    </div>


    <button
      class="button"
      id="upload"
      disabled
    >
      🚀 UPLOAD HÌNH ẢNH
    </button>


    <div
      class="progress-box"
      id="progressBox"
    >

      <div class="progress-top">

        <span id="progressText">
          ĐANG UPLOAD...
        </span>

        <span id="progressPercent">
          0%
        </span>

      </div>

      <div class="progress">

        <div
          class="progress-bar"
          id="progressBar"
        ></div>

      </div>

    </div>


    <div
      class="status"
      id="status"
    >
      SẴN SÀNG
    </div>


    <div
      class="result"
      id="result"
    >

      <div class="result-title">
        ✅ UPLOAD THÀNH CÔNG
      </div>

      <div
        class="url"
        id="resultUrl"
      ></div>


      <div class="actions">

        <button
          class="action"
          id="copy"
        >
          📋 SAO CHÉP URL
        </button>

        <button
          class="action"
          id="open"
        >
          🔗 MỞ HÌNH ẢNH
        </button>

      </div>

    </div>

  </section>


  <footer class="footer">

    FFVN.TGM IMAGE HOSTING 🔥

  </footer>

</main>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const fileInput =
  document.getElementById("file");

const drop =
  document.getElementById("drop");

const preview =
  document.getElementById("preview");

const previewImage =
  document.getElementById("previewImage");

const uploadButton =
  document.getElementById("upload");

const status =
  document.getElementById("status");

const progressBox =
  document.getElementById("progressBox");

const progressBar =
  document.getElementById("progressBar");

const progressText =
  document.getElementById("progressText");

const progressPercent =
  document.getElementById("progressPercent");

const result =
  document.getElementById("result");

const resultUrl =
  document.getElementById("resultUrl");

const dimensions =
  document.getElementById("dimensions");

const ratio =
  document.getElementById("ratio");

const size =
  document.getElementById("size");

const copyButton =
  document.getElementById("copy");

const openButton =
  document.getElementById("open");


let selectedFile = null;


/* =========================================================
   FORMAT SIZE
========================================================= */

function formatSize(bytes){

  if(bytes < 1024){

    return bytes + " B";
  }

  if(bytes < 1024 * 1024){

    return (
      bytes / 1024
    ).toFixed(1) + " KB";
  }

  return (
    bytes /
    1024 /
    1024
  ).toFixed(2) + " MB";
}


/* =========================================================
   RATIO
========================================================= */

function getRatio(w,h){

  const gcd =
    (a,b) =>
      b === 0
        ? a
        : gcd(b,a%b);

  const g =
    gcd(w,h);

  return (
    (w/g) +
    ":" +
    (h/g)
  );
}


/* =========================================================
   SELECT IMAGE
========================================================= */

fileInput.addEventListener(
  "change",
  function(){

    if(this.files?.length){

      loadFile(
        this.files[0]
      );
    }

  }
);


/* =========================================================
   LOAD IMAGE
========================================================= */

function loadFile(file){

  if(
    !file.type.startsWith("image/")
  ){

    status.textContent =
      "❌ FILE KHÔNG PHẢI HÌNH ẢNH";

    return;
  }


  if(
    file.size >
    4 * 1024 * 1024
  ){

    status.textContent =
      "❌ HÌNH ẢNH VƯỢT QUÁ 4MB";

    return;
  }


  selectedFile = file;

  uploadButton.disabled =
    false;


  result.classList.remove(
    "show"
  );


  const objectURL =
    URL.createObjectURL(file);


  previewImage.onload =
    function(){

      const w =
        previewImage.naturalWidth;

      const h =
        previewImage.naturalHeight;

      dimensions.textContent =
        `${w} × ${h}`;

      ratio.textContent =
        getRatio(w,h);

      URL.revokeObjectURL(
        objectURL
      );
    };


  previewImage.src =
    objectURL;


  preview.classList.add(
    "show"
  );


  size.textContent =
    formatSize(file.size);


  status.textContent =
    "✅ ĐÃ CHỌN HÌNH ẢNH";
}


/* =========================================================
   DRAG
========================================================= */

[
  "dragenter",
  "dragover"
].forEach(eventName => {

  drop.addEventListener(
    eventName,
    e => {

      e.preventDefault();

      drop.classList.add(
        "active"
      );

    }
  );

});


[
  "dragleave",
  "drop"
].forEach(eventName => {

  drop.addEventListener(
    eventName,
    e => {

      e.preventDefault();

      drop.classList.remove(
        "active"
      );

    }
  );

});


drop.addEventListener(
  "drop",
  e => {

    const file =
      e.dataTransfer.files?.[0];

    if(file){

      loadFile(file);
    }

  }
);


/* =========================================================
   UPLOAD
========================================================= */

uploadButton.addEventListener(
  "click",
  uploadImage
);


function uploadImage(){

  if(!selectedFile){

    return;
  }


  uploadButton.disabled =
    true;


  progressBox.classList.add(
    "show"
  );


  result.classList.remove(
    "show"
  );


  status.textContent =
    "⚡ ĐANG CHUẨN BỊ UPLOAD...";


  progressBar.style.width =
    "0%";

  progressPercent.textContent =
    "0%";


  /*
   * Gửi trực tiếp File.
   *
   * Không canvas.
   * Không chuyển đổi PNG.
   * Không FormData.
   *
   * Đây là phần giúp upload
   * nhanh hơn đáng kể.
   */

  const xhr =
    new XMLHttpRequest();


  xhr.open(
    "POST",
    "/api/upload",
    true
  );


  /*
   * Không đặt timeout = 10 giây.
   *
   * 10 giây là thời gian mục tiêu,
   * không phải thời gian tự hủy.
   */

  xhr.timeout =
    30000;


  xhr.setRequestHeader(
    "Content-Type",
    selectedFile.type ||
    "application/octet-stream"
  );


  xhr.upload.onprogress =
    function(event){

      if(!event.lengthComputable){

        return;
      }


      const percent =
        Math.round(
          event.loaded /
          event.total *
          100
        );


      progressBar.style.width =
        percent + "%";


      progressPercent.textContent =
        percent + "%";


      if(percent < 100){

        progressText.textContent =
          "⚡ ĐANG UPLOAD...";

        status.textContent =
          "⚡ ĐANG GỬI HÌNH ẢNH...";
      }

      else{

        progressText.textContent =
          "⚙️ ĐANG LƯU HÌNH ẢNH...";
      }

    };


  xhr.onload =
    function(){

      uploadButton.disabled =
        false;


      if(
        xhr.status >= 200 &&
        xhr.status < 300
      ){

        try{

          const data =
            JSON.parse(
              xhr.responseText
            );


          if(
            !data.success ||
            !data.url
          ){

            throw new Error(
              data.error ||
              "Upload thất bại."
            );
          }


          progressBar.style.width =
            "100%";

          progressPercent.textContent =
            "100%";


          progressText.textContent =
            "✅ HOÀN TẤT";


          resultUrl.textContent =
            data.url;


          result.classList.add(
            "show"
          );


          status.textContent =
            "✅ UPLOAD THÀNH CÔNG";


        }catch(error){

          showError(
            error.message
          );

        }

      }

      else{

        try{

          const data =
            JSON.parse(
              xhr.responseText
            );

          showError(
            data.error ||
            "Server upload lỗi."
          );

        }catch{

          showError(
            "Server trả về lỗi " +
            xhr.status
          );

        }

      }

    };


  xhr.onerror =
    function(){

      uploadButton.disabled =
        false;

      showError(
        "Không thể kết nối Server."
      );

    };


  xhr.ontimeout =
    function(){

      uploadButton.disabled =
        false;

      showError(
        "KẾT NỐI SERVER QUÁ LÂU. HÃY THỬ LẠI."
      );

    };


  xhr.onabort =
    function(){

      uploadButton.disabled =
        false;

      showError(
        "UPLOAD ĐÃ BỊ HỦY."
      );

    };


  /*
   * Bắt đầu upload ngay
   */

  xhr.send(
    selectedFile
  );
}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

  progressText.textContent =
    "❌ UPLOAD LỖI";

  status.textContent =
    "❌ " + message;

  progressBar.style.width =
    "0%";

  progressPercent.textContent =
    "0%";
}


/* =========================================================
   COPY
========================================================= */

copyButton.addEventListener(
  "click",
  async function(){

    const url =
      resultUrl.textContent.trim();

    if(!url){

      return;
    }


    try{

      await navigator.clipboard.writeText(
        url
      );

      status.textContent =
        "✅ ĐÃ SAO CHÉP URL";

    }catch{

      const textarea =
        document.createElement(
          "textarea"
        );

      textarea.value = url;

      document.body.appendChild(
        textarea
      );

      textarea.select();

      document.execCommand(
        "copy"
      );

      textarea.remove();

      status.textContent =
        "✅ ĐÃ SAO CHÉP URL";
    }

  }
);


/* =========================================================
   OPEN
========================================================= */

openButton.addEventListener(
  "click",
  function(){

    const url =
      resultUrl.textContent.trim();

    if(url){

      window.open(
        url,
        "_blank"
      );
    }

  }
);

</script>

</body>

</html>
