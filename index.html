<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>FFVN.TGM - CÔNG CỤ CHÈN ẢNH TẠO LINK URL</title>

<meta name="description" content="Công cụ chèn ảnh và tạo link URL trực tiếp nhanh chóng từ FFVN.TGM.">

<style>
@font-face{
    font-family:"GFF-Latin-Bold";
    src:
        url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2") format("woff2"),
        url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff") format("woff");
    font-display:swap;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --orange:#ff6500;
    --orange2:#ff9d2f;
    --bg:#050505;
}

body{
    min-height:100vh;
    color:#fff;
    font-family:"GFF-Latin-Bold",Arial,sans-serif;

    background:
        radial-gradient(circle at 10% 10%,rgba(255,106,0,.22),transparent 28%),
        radial-gradient(circle at 90% 15%,rgba(255,150,40,.14),transparent 25%),
        radial-gradient(circle at 50% 100%,rgba(255,70,0,.13),transparent 35%),
        #050505;
}

.container{
    width:min(920px,94%);
    margin:auto;
}

header{
    text-align:center;
    padding:25px 0 15px;
}

.logo{
    width:78px;
    height:78px;
    border-radius:22px;
    object-fit:cover;
    border:2px solid rgba(255,106,0,.5);
    box-shadow:0 0 30px rgba(255,106,0,.25);
}

h1{
    margin-top:16px;
    font-size:clamp(24px,6vw,42px);
    line-height:1.15;
}

.subtitle{
    max-width:700px;
    margin:10px auto 0;
    color:#999;
    font-family:Arial,sans-serif;
    font-size:14px;
    line-height:1.6;
}

.card{
    margin:25px auto;
    padding:22px;
    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,106,0,.09),
            rgba(255,255,255,.025)
        );

    border:1px solid rgba(255,106,0,.28);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 25px 80px rgba(0,0,0,.5),
        inset 0 1px rgba(255,255,255,.05);
}

.upload{
    min-height:220px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;
    padding:25px;

    border:2px dashed rgba(255,106,0,.45);
    border-radius:22px;

    background:rgba(255,106,0,.035);

    cursor:pointer;
    transition:.25s;
}

.upload:hover{
    border-color:var(--orange);
    background:rgba(255,106,0,.08);
}

.upload-icon{
    width:68px;
    height:68px;

    display:grid;
    place-items:center;

    margin-bottom:15px;

    border-radius:20px;

    font-size:32px;

    background:linear-gradient(
        135deg,
        #ff7600,
        #ff3b00
    );

    box-shadow:0 12px 30px rgba(255,106,0,.25);
}

.upload-title{
    font-size:21px;
}

.upload-desc{
    margin-top:8px;
    color:#999;
    font-family:Arial,sans-serif;
    font-size:13px;
    line-height:1.6;
}

#fileInput{
    display:none;
}

.preview-section{
    display:none;
    margin-top:20px;
}

.preview{
    width:100%;
    max-height:430px;

    display:block;

    object-fit:contain;

    background:#000;

    border-radius:20px;

    border:1px solid rgba(255,255,255,.1);
}

.info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:12px;
}

.info-box{
    min-width:0;
    padding:13px;
    border-radius:15px;

    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.06);
}

.info-label{
    color:#777;
    font-family:Arial,sans-serif;
    font-size:11px;
}

.info-value{
    margin-top:5px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:13px;
}

.create-url{
    display:none;
    margin-top:18px;
}

#createURLBtn{
    width:100%;
    min-height:54px;

    border:0;
    border-radius:15px;

    cursor:pointer;

    color:white;

    font-family:"GFF-Latin-Bold",Arial,sans-serif;
    font-size:16px;

    background:
        linear-gradient(
            135deg,
            #ff7600,
            #ff3c00
        );

    box-shadow:0 10px 25px rgba(255,90,0,.18);

    transition:.2s;
}

#createURLBtn:hover{
    filter:brightness(1.08);
    transform:translateY(-1px);
}

#createURLBtn:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}

.result{
    display:none;
    margin-top:20px;
}

.result-title{
    margin-bottom:9px;
    font-size:18px;
}

.url-box{
    display:flex;
    gap:8px;

    padding:8px;

    border-radius:16px;

    background:#070707;

    border:1px solid rgba(255,106,0,.38);
}

.url-input{
    flex:1;
    min-width:0;

    padding:10px;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-family:Arial,sans-serif;
    font-size:13px;
}

.copy-btn{
    min-width:110px;

    border:0;
    border-radius:12px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #ff7600,
            #ff3b00
        );

    cursor:pointer;

    font-family:"GFF-Latin-Bold",Arial,sans-serif;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:10px;
}

.action-btn{
    min-height:46px;

    border-radius:13px;

    border:1px solid rgba(255,255,255,.08);

    cursor:pointer;

    color:white;

    font-family:"GFF-Latin-Bold",Arial,sans-serif;

    background:rgba(255,255,255,.07);
}

.action-btn:hover{
    background:rgba(255,255,255,.12);
}

.message{
    display:none;
    margin-top:15px;
    padding:13px 15px;
    border-radius:14px;

    font-family:Arial,sans-serif;
    font-size:13px;
    line-height:1.5;
}

.message.success{
    display:block;
    color:#baffc4;
    background:rgba(40,255,100,.06);
    border:1px solid rgba(40,255,100,.16);
}

.message.error{
    display:block;
    color:#ffb6aa;
    background:rgba(255,40,20,.07);
    border:1px solid rgba(255,50,30,.17);
}

footer{
    padding:10px 20px 30px;
    text-align:center;
    color:#777;
    font-family:Arial,sans-serif;
    font-size:12px;
}

@media(max-width:650px){

    .card{
        padding:15px;
        border-radius:22px;
    }

    .info{
        grid-template-columns:1fr;
    }

    .url-box{
        flex-direction:column;
    }

    .copy-btn{
        min-height:45px;
    }

    .buttons{
        grid-template-columns:1fr;
    }

    .upload{
        min-height:190px;
    }

    h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>

<img
    class="logo"
    src="https://cdn.imagetourls.com/uploads/tyImg/1ggIdgxtr.jpg"
    alt="FFVN.TGM">

<h1>
    FFVN.TGM - CÔNG CỤ CHÈN ẢNH TẠO LINK URL
</h1>

<p class="subtitle">
    Công cụ chèn ảnh và tạo link URL trực tiếp nhanh chóng từ FFVN.TGM.
    Hỗ trợ Android, iPhone và máy tính.
</p>

</header>

<main class="card">

<label class="upload" for="fileInput">

    <div class="upload-icon">
        ＋
    </div>

    <div class="upload-title">
        CHỌN HÌNH ẢNH
    </div>

    <div class="upload-desc">
        Nhấn để chọn ảnh từ Album hoặc thiết bị<br>
        PNG • JPG • JPEG • WEBP • GIF • AVIF<br>
        Dung lượng tối đa 4 MB
    </div>

</label>

<input
    id="fileInput"
    type="file"
    accept="image/png,image/jpeg,image/webp,image/gif,image/avif">


<section
    id="previewSection"
    class="preview-section">

    <img
        id="preview"
        class="preview"
        alt="Preview">

    <div class="info">

        <div class="info-box">
            <div class="info-label">
                TÊN FILE
            </div>

            <div
                id="fileName"
                class="info-value">
                -
            </div>
        </div>

        <div class="info-box">
            <div class="info-label">
                DUNG LƯỢNG
            </div>

            <div
                id="fileSize"
                class="info-value">
                -
            </div>
        </div>

        <div class="info-box">
            <div class="info-label">
                ĐỊNH DẠNG
            </div>

            <div
                id="fileType"
                class="info-value">
                -
            </div>
        </div>

    </div>

</section>


<div
    id="createURLBox"
    class="create-url">

    <button id="createURLBtn">
        🔗 TẠO URL ẢNH
    </button>

</div>


<section
    id="result"
    class="result">

    <div class="result-title">
        🔗 LINK URL ẢNH
    </div>

    <div class="url-box">

        <input
            id="urlInput"
            class="url-input"
            type="text"
            readonly>

        <button
            id="copyBtn"
            class="copy-btn">
            SAO CHÉP
        </button>

    </div>

    <div class="buttons">

        <button
            id="openBtn"
            class="action-btn">
            MỞ ẢNH
        </button>

        <button
            id="htmlBtn"
            class="action-btn">
            COPY HTML
        </button>

        <button
            id="newBtn"
            class="action-btn">
            ẢNH MỚI
        </button>

    </div>

</section>


<div
    id="message"
    class="message">
</div>

</main>

<footer>
    © 2026 FFVN.TGM - ALL RIGHTS RESERVED.
</footer>

</div>


<script>

const API_URL = "/api/upload";

const SITE_URL =
    "https://img-ffvn-tgm-com.vercel.app";


const input =
    document.getElementById("fileInput");

const preview =
    document.getElementById("preview");

const previewSection =
    document.getElementById("previewSection");

const createURLBox =
    document.getElementById("createURLBox");

const createURLBtn =
    document.getElementById("createURLBtn");

const result =
    document.getElementById("result");

const urlInput =
    document.getElementById("urlInput");

const fileName =
    document.getElementById("fileName");

const fileSize =
    document.getElementById("fileSize");

const fileType =
    document.getElementById("fileType");

const message =
    document.getElementById("message");

const copyBtn =
    document.getElementById("copyBtn");

const openBtn =
    document.getElementById("openBtn");

const htmlBtn =
    document.getElementById("htmlBtn");

const newBtn =
    document.getElementById("newBtn");


let selectedFile = null;

let uploadedFilename = "";

let currentURL = "";


/* =========================
   SIZE
========================= */

function formatSize(bytes){

    if(bytes < 1024)
        return bytes + " B";

    if(bytes < 1024 * 1024)
        return (bytes / 1024).toFixed(1) + " KB";

    return (bytes / 1024 / 1024).toFixed(2) + " MB";
}


/* =========================
   RANDOM NAME
========================= */

function randomName(ext){

    const chars =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

    let result = "";

    for(let i = 0; i < 8; i++){

        result += chars[
            Math.floor(
                Math.random() * chars.length
            )
        ];

    }

    return result + "." + ext;
}


/* =========================
   MESSAGE
========================= */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;
}


/* =========================
   GET EXT
========================= */

function getExtension(file){

    let ext =
        file.name
            .split(".")
            .pop()
            .toLowerCase();

    if(ext === "jpeg")
        ext = "jpg";

    return ext;
}


/* =========================
   UPLOAD
========================= */

async function uploadImage(file){

    const ext =
        getExtension(file);

    const filename =
        randomName(ext);

    const formData =
        new FormData();

    formData.append(
        "file",
        file,
        filename
    );


    const response =
        await fetch(
            API_URL,
            {
                method:"POST",
                body:formData
            }
        );


    let data = null;

    try{

        data =
            await response.json();

    }catch{

        throw new Error(
            "API không trả về JSON hợp lệ."
        );

    }


    if(
        !response.ok ||
        !data ||
        !data.success ||
        !data.filename
    ){

        throw new Error(
            data?.error ||
            "Upload hình ảnh thất bại."
        );

    }


    uploadedFilename =
        data.filename;


    return uploadedFilename;
}


/* =========================
   CHỌN ẢNH
========================= */

input.addEventListener(
    "change",
    function(){

        const file =
            this.files?.[0];

        if(!file)
            return;


        /* RESET TRẠNG THÁI URL */

        selectedFile = file;

        uploadedFilename = "";

        currentURL = "";

        result.style.display =
            "none";


        /* CHECK SIZE */

        if(
            file.size >
            4 * 1024 * 1024
        ){

            showMessage(
                "❌ Hình ảnh vượt quá 4 MB.",
                "error"
            );

            input.value = "";

            return;
        }


        /* CHECK TYPE */

        const allowed = [

            "image/png",
            "image/jpeg",
            "image/webp",
            "image/gif",
            "image/avif"

        ];


        if(
            !allowed.includes(
                file.type
            )
        ){

            showMessage(
                "❌ Định dạng hình ảnh không được hỗ trợ.",
                "error"
            );

            input.value = "";

            return;
        }


        /* PREVIEW */

        preview.src =
            URL.createObjectURL(file);

        previewSection.style.display =
            "block";


        fileName.textContent =
            file.name;

        fileSize.textContent =
            formatSize(file.size);

        fileType.textContent =
            file.type;


        /* HIỆN NÚT */

        createURLBox.style.display =
            "block";

        createURLBtn.disabled =
            false;

        createURLBtn.textContent =
            "🔗 TẠO URL ẢNH";


        showMessage(
            "Ảnh đã được chọn. Nhấn TẠO URL ẢNH.",
            "success"
        );

    }
);


/* =========================
   TẠO URL
========================= */

createURLBtn.addEventListener(
    "click",
    async function(){

        if(!selectedFile){

            showMessage(
                "❌ Vui lòng chọn hình ảnh trước.",
                "error"
            );

            return;
        }


        /*
           Nếu chưa upload:
           upload ngay lúc bấm nút.
        */

        if(!uploadedFilename){

            try{

                createURLBtn.disabled =
                    true;

                createURLBtn.textContent =
                    "🔗 ĐANG TẠO URL...";


                /*
                   QUAN TRỌNG:
                   Upload ngay tại đây.
                */

                await uploadImage(
                    selectedFile
                );


            }catch(error){

                console.error(error);

                createURLBtn.disabled =
                    false;

                createURLBtn.textContent =
                    "🔗 TẠO URL ẢNH";


                showMessage(
                    "❌ " +
                    (
                        error.message ||
                        "Không thể upload hình ảnh."
                    ),
                    "error"
                );

                return;
            }

        }


        /*
           ĐẾN ĐÂY CHẮC CHẮN
           ĐÃ CÓ uploadedFilename
        */

        if(!uploadedFilename){

            createURLBtn.disabled =
                false;

            createURLBtn.textContent =
                "🔗 TẠO URL ẢNH";

            showMessage(
                "❌ Không lấy được tên hình ảnh.",
                "error"
            );

            return;
        }


        /*
           TẠO URL CUSTOM
        */

        currentURL =
            SITE_URL +
            "/images/" +
            encodeURIComponent(
                uploadedFilename
            );


        /*
           HIỆN LINK NGAY
        */

        urlInput.value =
            currentURL;

        result.style.display =
            "block";


        createURLBtn.disabled =
            false;

        createURLBtn.textContent =
            "✅ URL ĐÃ ĐƯỢC TẠO";


        showMessage(
            "✅ Link URL ảnh đã được tạo thành công.",
            "success"
        );


        result.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });

    }
);


/* =========================
   COPY URL
========================= */

copyBtn.addEventListener(
    "click",
    async function(){

        if(!currentURL)
            return;


        try{

            await navigator.clipboard.writeText(
                currentURL
            );

            copyBtn.textContent =
                "ĐÃ SAO CHÉP";

            setTimeout(
                () => {

                    copyBtn.textContent =
                        "SAO CHÉP";

                },
                1500
            );

        }catch{

            urlInput.focus();

            urlInput.select();

            document.execCommand(
                "copy"
            );

        }

    }
);


/* =========================
   OPEN
========================= */

openBtn.addEventListener(
    "click",
    function(){

        if(!currentURL)
            return;

        window.open(
            currentURL,
            "_blank"
        );

    }
);


/* =========================
   COPY HTML
========================= */

htmlBtn.addEventListener(
    "click",
    async function(){

        if(!currentURL)
            return;


        const html =
            `<img src="${currentURL}" alt="FFVN.TGM">`;


        try{

            await navigator.clipboard.writeText(
                html
            );

            htmlBtn.textContent =
                "ĐÃ SAO CHÉP";

            setTimeout(
                () => {

                    htmlBtn.textContent =
                        "COPY HTML";

                },
                1500
            );

        }catch{

            alert(html);

        }

    }
);


/* =========================
   ẢNH MỚI
========================= */

newBtn.addEventListener(
    "click",
    function(){

        selectedFile = null;

        uploadedFilename = "";

        currentURL = "";

        input.value = "";

        preview.removeAttribute(
            "src"
        );

        previewSection.style.display =
            "none";

        createURLBox.style.display =
            "none";

        result.style.display =
            "none";

        urlInput.value = "";

        createURLBtn.disabled =
            false;

        createURLBtn.textContent =
            "🔗 TẠO URL ẢNH";

        message.textContent = "";

        message.className =
            "message";


        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
);

</script>

</body>
            </html>
